name: Build Desktop App Installers

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-jar:
    name: Build Backend JAR (H2 Embedded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: |
          cd java/opentron-java/backend
          mvn clean package -DskipTests=true -q
          JAR=$(ls -t target/*-exec.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then
            echo "ERROR: No exec JAR built"
            ls -la target/
            exit 1
          fi
          cp "$JAR" /tmp/backend.jar
        shell: bash

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: /tmp/backend.jar
          retention-days: 1

  build-desktop-windows:
    name: Build Desktop (Windows)
    needs: [build-jar]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-download

      - name: Setup Sidecar
        run: |
          if exist frontend\src-tauri\sidecar\backend.jar del /f /q frontend\src-tauri\sidecar\backend.jar
          if exist frontend\src-tauri\sidecar\jre rmdir /s /q frontend\src-tauri\sidecar\jre
          if not exist frontend\src-tauri\sidecar mkdir frontend\src-tauri\sidecar
          copy /y backend-download\backend.jar frontend\src-tauri\sidecar\backend.jar
          "%JAVA_HOME%\bin\jlink.exe" --add-modules java.base,java.logging,java.net.http,java.management,java.naming,java.sql,java.transaction.xa,java.security.jgss,jdk.charsets,jdk.unsupported,java.xml,java.desktop,java.instrument,jdk.management,jdk.crypto.ec --strip-debug --no-header-files --no-man-pages --compress=2 --output frontend\src-tauri\sidecar\jre
          if not exist frontend\src-tauri\sidecar\backend.jar exit /b 1
          if not exist frontend\src-tauri\sidecar\jre\bin\java.exe exit /b 1
        shell: cmd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: NPM Install
        run: |
          cd frontend
          npm ci --no-audit --no-fund
        shell: cmd

      - name: TypeScript Compile
        run: |
          cd frontend
          npx tsc -b
        shell: cmd

      - name: Vite Build
        run: |
          cd frontend
          npx vite build --outDir dist
        shell: cmd

      - name: Tauri Build
        run: |
          cd frontend
          npm run tauri build
        shell: cmd

      - name: Upload MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-msi
          path: frontend/src-tauri/target/release/bundle/msi/
          retention-days: 1

      - name: Upload NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-nsis
          path: frontend/src-tauri/target/release/bundle/nsis/
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build-desktop-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: installer-windows-msi
          path: installers

      - name: Download NSIS
        uses: actions/download-artifact@v4
        with:
          name: installer-windows-nsis
          path: installers

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          draft: false
          tag_name: ${{ github.ref_name }}
          body: |
            # OpenTron v${{ github.ref_name }}
            
            Production-ready desktop application - zero external dependencies.
            
            **Included:**
            - Java 21 Runtime (minimal JRE)
            - Spring Boot 3.1 + H2 Database
            - React 19 + Tauri Frontend
            
            **Windows Installation:**
            Download .msi or .exe and run - no setup required. Data stored at ~/.opentron/opentron.h2
