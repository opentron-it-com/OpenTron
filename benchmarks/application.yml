spring:
  application:
    name: opentron-backend-benchmark
  jpa:
    hibernate:
      ddl-auto: create-drop
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  flyway:
    enabled: false

server:
  port: 8080
  servlet:
    context-path: /

engine:
  host: http://localhost:11434
  apiKey: ""

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: opentron-benchmark

logging:
  level:
    root: INFO
    org.opentron: DEBUG
    org.springframework.web: DEBUG
