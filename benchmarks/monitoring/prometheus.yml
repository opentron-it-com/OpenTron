global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'opentron-benchmark'

scrape_configs:
  - job_name: 'opentron-java'
    static_configs:
      - targets: ['opentron-backend:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
